[package]
name = "outbound"
version = "0.1.0"
edition = "2024"
description = "Tray app that mirrors new files from local folders to a VPS over ssh"
license = "MIT"
repository = "https://github.com/shalemore/outbound"
readme = "README.md"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
notify-rust = "4.18.2"
opener = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
ssh2-config = "0.8.2"
tao = "0.37.1"
tinyfiledialogs = "3.9.1"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
trash = "5.2.9"
tray-icon = "0.26.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# What the Scoop manifest needs to know besides the package metadata. tools/package reads it.
[package.metadata.scoop]
shortcut = "Outbound"
cleanup = "--cleanup"
notes = "Run 'outbound' to start it in the tray. The first run writes a configuration template; open it from the tray menu, set the ssh host and the folders, and save."
