[package]
name = "outbound"
version = "0.3.0"
edition = "2024"
description = "Tray app that moves files from local folders to a Linux server over ssh"
license = "MIT"
repository = "https://github.com/shalemore/outbound"
readme = "README.md"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tao = "0.37.1"
tauri-winrt-notification = "0.8.1"
toml_edit = { version = "0.25.17", features = ["serde"] }
trash = "5.2.9"
tray-icon = "0.26.1"
walkdir = "2.5.0"
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
notify = { version = "8.2.0", default-features = false }
log = "0.4.34"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[build-dependencies]
winresource = "0.1.34"

# What the Scoop manifest needs to know besides the package metadata. tools/package reads it.
[package.metadata.scoop]
shortcut = "Outbound"
cleanup = "--cleanup"
notes = "Run 'outbound' to start it in the tray. The first run writes a configuration template; open it from the tray menu, set the ssh host and the folders, and save."
