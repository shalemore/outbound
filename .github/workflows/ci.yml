name: CI

# A change to the README alone does not start it.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md

# A newer push to the same branch makes the run of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # The release packages the program with tools/package, so try it on every change instead of on
      # the day of the release.
      - name: Rehearse the packaging
        run: cargo run --release --locked --manifest-path tools/package/Cargo.toml -- target/release/outbound.exe dist
