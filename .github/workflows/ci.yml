name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Only Windows is tested by hand. macOS and Linux are compiled and unit-tested here so the
    # code stays portable, but nothing is released for them.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # The release packages the program with tools/package, so try it on every change instead of on
      # the day of the release.
      - name: Rehearse the packaging
        if: runner.os == 'Windows'
        run: cargo run --release --locked --manifest-path tools/package/Cargo.toml -- target/release/outbound.exe dist
